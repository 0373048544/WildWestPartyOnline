[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="resources/**/*.json,config/*.cfg"
exclude_filter="server/*,tests/*,tools/*,build/*,web/*,README.md,*.ps1,*.cjs"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug="res://build/templates/web_nothreads_debug.zip"
custom_template/release="res://build/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><script src=\"network-config.js\"></script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
